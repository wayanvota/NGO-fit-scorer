# Render blueprint. New > Blueprint, point at your fork of this repo.
# Set the secret env vars in the Render dashboard.
services:
  - type: web
    name: funding-fit-scorer
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALLOWED_EMAIL_DOMAINS
        sync: false
      - key: INITIAL_ADMIN_EMAILS
        sync: false
      - key: DEV_AUTH
        value: "false"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: BASE_URL
        sync: false
      - key: STRONG_MODEL
        value: claude-sonnet-5
      - key: FAST_MODEL
        value: claude-haiku-4-5
      - key: RECAL_MODEL
        value: claude-opus-4-8
